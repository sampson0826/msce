<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSCE — Constraint Conflict Detector</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup">
    <header>
      <span class="logo">MSCE</span>
      <span class="badge">v0.1</span>
    </header>

    <div class="status" id="status">
      <span class="dot"></span>
      <span id="status-text">Monitoring arXiv...</span>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-value" id="papers-scanned">0</span>
        <span class="stat-label">Papers Scanned</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="conflicts-found">0</span>
        <span class="stat-label">Conflicts Found</span>
      </div>
    </div>

    <div class="actions">
      <a href="https://github.com/msce-ai/msce" target="_blank" class="btn-primary">GitHub</a>
      <a href="https://colab.research.google.com/github/msce-ai/msce/blob/main/notebooks/hubble_tension.ipynb" target="_blank" class="btn-secondary">Try Colab</a>
    </div>

    <footer>
      <span>MSCE Collaboration</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
