<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>规则稳定性空间 — 3D约束地形</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'SF Mono','Menlo',monospace}
#container{position:fixed;top:0;left:0;width:100%;height:100%}
#info{position:fixed;top:20px;left:20px;color:#c8c8d8;pointer-events:none;z-index:10}
#info h1{font-size:18px;color:#fff;margin-bottom:4px}
#info .sub{font-size:11px;color:#556}
#legend{position:fixed;bottom:30px;left:20px;color:#889;font-size:10px;z-index:10;pointer-events:none;line-height:1.8}
#legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
#tooltip{position:fixed;pointer-events:none;z-index:20;background:rgba(8,8,24,0.95);border:1px solid #2a2a4a;border-radius:8px;padding:12px 16px;color:#c8c8d8;font-size:11px;display:none;max-width:280px;line-height:1.6}
#controls{position:fixed;bottom:30px;right:20px;color:#556;font-size:10px;z-index:10;pointer-events:none;text-align:right;line-height:1.8}
</style>
</head>
<body>
<div id="container"></div>
<div id="info">
  <h1>规则稳定性空间 · Constraint Stability Landscape</h1>
  <div class="sub">地形高度 = 约束稳定性 S(p)  |  山峰 = 已知执行者  |  凹陷 = 缺失执行者  |  暗区 = 完美平坦区</div>
</div>
<div id="legend">
  <span class="dot" style="background:#44ff88;box-shadow:0 0 10px #44ff88"></span> E₁-E₇ 已知执行者（稳定性支柱）<br>
  <span class="dot" style="background:#ff6644;box-shadow:0 0 10px #ff6644"></span> M₁ 常数选择缺失（参数空间凹陷）<br>
  <span class="dot" style="background:#ff44aa;box-shadow:0 0 10px #ff44aa"></span> M₂ 量子引力断崖（Planck尺度悬崖）<br>
  <span class="dot" style="background:#aa44ff;box-shadow:0 0 10px #aa44ff"></span> M₃ Type III 暗区（约束完美抵消）
</div>
<div id="controls">
  🖱 拖拽旋转 · 滚轮缩放 · 右键平移<br>
  点击标记查看详情
</div>
<div id="tooltip"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const container = document.getElementById('container');
const tooltip = document.getElementById('tooltip');

// Scene setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020210);
scene.fog = new THREE.Fog(0x020210, 15, 60);

const camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.5, 120);
camera.position.set(12, 9, 16);
camera.lookAt(0, -1, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(container.clientWidth, container.clientHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
container.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, -1, 0);
controls.minDistance = 5;
controls.maxDistance = 35;
controls.maxPolarAngle = Math.PI * 0.75;
controls.update();

// Lighting
const ambient = new THREE.AmbientLight(0x222244, 1.5);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(15, 20, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 80;
sun.shadow.camera.left = -20;
sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20;
sun.shadow.camera.bottom = -20;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x4466aa, 0.8);
fill.position.set(-5, 3, -5);
scene.add(fill);

// Grid
const gridHelper = new THREE.PolarGridHelper(14, 64, 48, 256, 0x1a1a3a, 0x1a1a3a);
gridHelper.position.y = -4;
scene.add(gridHelper);

// ===== Constraint Stability Function =====
// S(p) = contribution from known executors at point p=(x,z)
// Height map: y = S(x,z)
function stabilityHeight(x, z) {
  const r = Math.sqrt(x * x + z * z);
  const theta = Math.atan2(z, x);

  let h = 0;

  // Base floor (weak stability from L-1 logical consistency)
  h += 0.15;

  // E₁ Noether: strong at all radii, peaks near center
  h += 2.5 * Math.exp(-r * r / 8);

  // E₂ Gauge: strength increases toward center (coupling runs)
  h += 1.8 * Math.exp(-r * r / 12) * (1 + 0.3 * Math.cos(theta * 3));

  // E₃ Pauli: strong at short range (exclusion core)
  h += 2.0 * Math.exp(-r * r / 3);

  // E₄ Stone unitary: uniform moderate stability
  h += 1.2 * Math.exp(-r * r / 20);

  // E₅ Causality: edge of light cone, drops sharply beyond r=10
  h += 1.5 / (1 + Math.exp((r - 10) / 1.5));

  // E₆ Scale separation: creates terraced plateaus
  h += 0.8 * (1 / (1 + Math.exp((r - 6) / 1.0)));
  h += 0.6 * (1 / (1 + Math.exp((r - 9) / 0.8)));

  // E₇ Decoherence: strongest at large r (classical limit)
  h += 1.0 * (1 - Math.exp(-r * r / 25));

  // ---- Missing Executor Effects (subtractions) ----

  // M₁: 19-parameter selection — creates a depression at (x≈-3, z≈3)
  const m1x = -3.0, m1z = 3.5;
  const d1 = Math.sqrt((x - m1x) ** 2 + (z - m1z) ** 2);
  h -= 1.8 * Math.exp(-d1 * d1 / 4); // Localized stability deficit

  // M₂: Quantum gravity cliff — sharp drop beyond r > 11 (Planck scale)
  h -= 2.5 / (1 + Math.exp(-(r - 11.5) / 0.4)); // Steep drop at Planck boundary

  // M₃: Type III Dark Zone — perfectly flat region (cancellation zone)
  const m3x = 4.0, m3z = -3.0;
  const d3 = Math.sqrt((x - m3x) ** 2 + (z - m3z) ** 2);
  // Inside dark zone: height is locked at exactly 2.0 — perfect cancellation
  const darkZone = d3 < 1.5;
  if (darkZone) {
    h = 2.0; // Perfectly flat — no variation, no signal
  } else {
    // Slight perturbation near dark zone boundary
    h += 0.4 * Math.exp(-d3 * d3 / 6);
  }

  return Math.max(0, h);
}

// ===== Build Terrain =====
const terrainSize = 24;
const segments = 200;
const geometry = new THREE.PlaneGeometry(terrainSize, terrainSize, segments, segments);
geometry.rotateX(-Math.PI / 2);

const positions = geometry.attributes.position;
const colors = new Float32Array(positions.count * 3);

for (let i = 0; i < positions.count; i++) {
  const x = positions.getX(i);
  const z = positions.getZ(i);
  const h = stabilityHeight(x, z);
  positions.setY(i, h);

  // Color: height-based with special zones
  const r = Math.sqrt(x * x + z * z);
  const d1 = Math.sqrt((x + 3) ** 2 + (z - 3.5) ** 2);
  const d3 = Math.sqrt((x - 4) ** 2 + (z + 3) ** 2);

  let cr, cg, cb;

  if (d3 < 1.5) {
    // Dark zone: purple glow
    cr = 0.55; cg = 0.15; cb = 0.65;
  } else if (d1 < 1.8) {
    // M₁ region: warm depression
    cr = 0.75; cg = 0.25; cb = 0.15;
  } else if (r > 11) {
    // M₂ cliff: red warning
    cr = 0.7; cg = 0.15; cb = 0.2;
  } else if (h > 4) {
    // High stability peaks: green-gold
    cr = 0.3; cg = 0.7; cb = 0.25;
  } else if (h > 2.5) {
    // Moderate stability: teal
    cr = 0.2; cg = 0.5; cb = 0.55;
  } else if (h > 1) {
    // Low stability: blue
    cr = 0.15; cg = 0.25; cb = 0.6;
  } else {
    // Very low: dark blue
    cr = 0.08; cg = 0.1; cb = 0.35;
  }

  colors[i * 3] = cr;
  colors[i * 3 + 1] = cg;
  colors[i * 3 + 2] = cb;
}

geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geometry.computeVertexNormals();

const terrainMat = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.55,
  metalness: 0.15,
  flatShading: false,
});
const terrain = new THREE.Mesh(geometry, terrainMat);
terrain.castShadow = true;
terrain.receiveShadow = true;
scene.add(terrain);

// Wireframe overlay
const wireGeo = new THREE.PlaneGeometry(terrainSize, terrainSize, 80, 80);
wireGeo.rotateX(-Math.PI / 2);
for (let i = 0; i < wireGeo.attributes.position.count; i++) {
  const x = wireGeo.attributes.position.getX(i);
  const z = wireGeo.attributes.position.getZ(i);
  wireGeo.attributes.position.setY(i, stabilityHeight(x, z) + 0.03);
}
const wireMat = new THREE.MeshBasicMaterial({ color: 0x1a1a3a, wireframe: true, transparent: true, opacity: 0.15 });
const wireframe = new THREE.Mesh(wireGeo, wireMat);
scene.add(wireframe);

// ===== Executor Markers =====
function createMarker(x, z, color, label, sublabel, height_override) {
  const h = height_override || stabilityHeight(x, z);
  const group = new THREE.Group();

  // Pillar
  const pillarGeo = new THREE.CylinderGeometry(0.12, 0.25, h + 0.3, 16);
  const pillarMat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.7, roughness: 0.3, metalness: 0.5 });
  const pillar = new THREE.Mesh(pillarGeo, pillarMat);
  pillar.position.y = (h + 0.3) / 2;
  pillar.castShadow = true;
  group.add(pillar);

  // Glowing orb on top
  const orbGeo = new THREE.SphereGeometry(0.35, 32, 32);
  const orbMat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 1.2, roughness: 0.2, metalness: 0.3 });
  const orb = new THREE.Mesh(orbGeo, orbMat);
  orb.position.y = h + 0.65;
  orb.castShadow = true;
  group.add(orb);

  // Glow ring
  const ringGeo = new THREE.TorusGeometry(0.5, 0.06, 16, 48);
  const ringMat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.8, roughness: 0.2, metalness: 0.4, transparent: true, opacity: 0.7 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.y = h + 0.65;
  ring.rotation.x = Math.PI / 2;
  group.add(ring);

  // Label
  const div = document.createElement('div');
  div.innerHTML = `<div style="color:#fff;font-size:13px;font-weight:bold;text-shadow:0 0 10px ${'#'+color.toString(16).padStart(6,'0')}">${label}</div><div style="color:#889;font-size:9px">${sublabel}</div>`;
  const labelObj = new CSS2DObject(div);
  labelObj.position.set(0, h + 1.2, 0);
  group.add(labelObj);

  group.position.set(x, 0, z);
  group.userData = { label, sublabel, color: '#' + color.toString(16).padStart(6, '0'), type: 'executor' };
  return group;
}

// Known Executors (green pillars)
const eMarkers = [
  { x: 0, z: 0, label: 'E₁ 规范协变', sub: 'U(1)×SU(2)×SU(3)→规范场' },
  { x: 1.8, z: 1.2, label: 'E₂ Noether', sub: '连续对称→守恒流' },
  { x: -1.5, z: -1.0, label: 'E₃ Stone', sub: '酉群→哈密顿量' },
  { x: 0.8, z: -1.8, label: 'E₄ Pauli', sub: '半整数自旋→反对称' },
  { x: -2.0, z: 1.5, label: 'E₅ 因果性', sub: 'c有限→类空对易' },
  { x: 1.2, z: 2.5, label: 'E₆ 标度分离', sub: 'RG流→有效理论' },
  { x: -0.5, z: -2.5, label: 'E₇ 退相干', sub: '开放系统→经典极限' },
];

eMarkers.forEach(em => {
  scene.add(createMarker(em.x, em.z, 0x44ff88, em.label, em.sub));
});

// Missing Executors (red/orange/purple pits)
// M₁: depression
const m1Group = createMarker(-3.0, 3.5, 0xff6644, 'M₁ 常数选择', '19参数→RG不动点?', 0.4);
m1Group.children.forEach(c => { if (c.userData) c.userData = { label: 'M₁', sublabel: '缺失执行者: 常数谱确定律', color: '#ff6644', type: 'missing', detail: '19个自由参数无第一性原理解释。约束残差指向RG联合不动点选择机制。若为E-I型，所有β函数在Planck尺度同时为零。MSSM规范耦合已呈现~1%汇聚。' }; });
scene.add(m1Group);

// M₂: cliff edge
const m2Group = createMarker(11.8, 0, 0xff44aa, 'M₂ 量子引力', 'Planck尺度断崖', 0.15);
m2Group.children.forEach(c => { if (c.userData) c.userData = { label: 'M₂', sublabel: '缺失执行者: 量子引力统一', color: '#ff44aa', type: 'missing', detail: '广义相对论在Planck尺度(~10⁻³⁵m)发散。GR约束力在此断裂。候选:弦论/圈量子/渐近安全。最困难的执行者缺口。' }; });
scene.add(m2Group);

// M₃: dark zone
const m3Group = createMarker(4.0, -3.0, 0xaa44ff, 'M₃ 暗区', '约束完美抵消·零信号', 2.0);
m3Group.children.forEach(c => { if (c.userData) c.userData = { label: 'M₃', sublabel: 'Type III暗区: 最危险的不可见', color: '#aa44ff', type: 'darkzone', detail: '多条已知规则在此形成完美交叉平衡——合力为零、完全不可见。需要在Planck能标/极端曲率下打破平衡才能暴露隐藏规则。目前没有任何实验证据——因为根本没有信号逃逸。' }; });
scene.add(m3Group);

// Dark zone boundary ring
const dzRingGeo = new THREE.TorusGeometry(1.55, 0.04, 32, 80);
const dzRingMat = new THREE.MeshStandardMaterial({ color: 0xaa44ff, emissive: 0xaa44ff, emissiveIntensity: 0.6, roughness: 0.3, transparent: true, opacity: 0.5 });
const dzRing = new THREE.Mesh(dzRingGeo, dzRingMat);
dzRing.position.set(4.0, 2.05, -3.0);
dzRing.rotation.x = Math.PI / 2;
scene.add(dzRing);

// M₂ cliff warning line
const cliffGeo = new THREE.TorusGeometry(11.5, 0.03, 16, 120);
const cliffMat = new THREE.MeshStandardMaterial({ color: 0xff44aa, emissive: 0xff44aa, emissiveIntensity: 0.4, roughness: 0.3, transparent: true, opacity: 0.4 });
const cliffRing = new THREE.Mesh(cliffGeo, cliffMat);
cliffRing.position.y = 0.25;
cliffRing.rotation.x = Math.PI / 2;
scene.add(cliffRing);

// ===== Particles: flow lines showing constraint direction =====
const particlesGeo = new THREE.BufferGeometry();
const particleCount = 300;
const particlePositions = new Float32Array(particleCount * 3);
const particleColors = new Float32Array(particleCount * 3);
const particleData = [];

for (let i = 0; i < particleCount; i++) {
  const angle = Math.random() * Math.PI * 2;
  const radius = 2 + Math.random() * 11;
  const x = Math.cos(angle) * radius;
  const z = Math.sin(angle) * radius;
  const h = stabilityHeight(x, z);
  particlePositions[i * 3] = x;
  particlePositions[i * 3 + 1] = h + 0.15 + Math.random() * 0.5;
  particlePositions[i * 3 + 2] = z;

  // Color by region
  const d3 = Math.sqrt((x - 4) ** 2 + (z + 3) ** 2);
  if (d3 < 1.5) {
    particleColors[i*3]=0.8; particleColors[i*3+1]=0.3; particleColors[i*3+2]=0.9;
  } else if (radius > 11) {
    particleColors[i*3]=0.9; particleColors[i*3+1]=0.2; particleColors[i*3+2]=0.3;
  } else if (h > 4) {
    particleColors[i*3]=0.3; particleColors[i*3+1]=0.8; particleColors[i*3+2]=0.3;
  } else {
    particleColors[i*3]=0.3; particleColors[i*3+1]=0.5; particleColors[i*3+2]=0.7;
  }

  particleData.push({ angle, radius, speed: 0.1 + Math.random() * 0.3, yOff: Math.random() * 0.4 });
}

particlesGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
particlesGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
const particlesMat = new THREE.PointsMaterial({ size: 0.08, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.7 });
const particles = new THREE.Points(particlesGeo, particlesMat);
scene.add(particles);

// ===== Raycaster for interaction =====
const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 0.5;
const mouse = new THREE.Vector2();
const clickables = [m1Group, m2Group, m3Group, ...eMarkers.map(() => null)].filter(Boolean);

// Actually collect all marker orbs
const allMarkers = [];
scene.traverse(child => {
  if (child.isMesh && child.material.emissiveIntensity > 0.5 && child.geometry.type === 'SphereGeometry') {
    allMarkers.push(child);
  }
});

window.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(allMarkers);
  if (intersects.length > 0) {
    const obj = intersects[0].object;
    let parent = obj;
    while (parent && !parent.userData?.label) parent = parent.parent;
    if (parent?.userData?.detail) {
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 20) + 'px';
      tooltip.style.top = (e.clientY - 20) + 'px';
      tooltip.innerHTML = `<b style="color:${parent.userData.color}">${parent.userData.label}</b> <span style="color:#667">${parent.userData.sublabel}</span><br><br>${parent.userData.detail}`;
      document.body.style.cursor = 'pointer';
      return;
    }
  }
  tooltip.style.display = 'none';
  document.body.style.cursor = 'grab';
});

// ===== Animation =====
function animate(time) {
  requestAnimationFrame(animate);
  controls.update();

  // Animate particles orbiting
  for (let i = 0; i < particleCount; i++) {
    const pd = particleData[i];
    pd.angle += pd.speed * 0.003;
    const x = Math.cos(pd.angle) * pd.radius;
    const z = Math.sin(pd.angle) * pd.radius;
    const h = stabilityHeight(x, z);
    particlePositions[i * 3] = x;
    particlePositions[i * 3 + 1] = h + 0.15 + Math.sin(time * 0.002 + i) * 0.2;
    particlePositions[i * 3 + 2] = z;
  }
  particlesGeo.attributes.position.needsUpdate = true;

  // Pulse dark zone ring
  const pulse = 1 + Math.sin(time * 0.003) * 0.15;
  dzRing.scale.set(pulse, pulse, pulse);
  dzRing.material.opacity = 0.35 + Math.sin(time * 0.004) * 0.2;

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

// Resize handler
window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
  labelRenderer.setSize(container.clientWidth, container.clientHeight);
});

animate(0);
</script>
</body>
</html>
