<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纠缠裂缝 — 空间基底的可控撕裂</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050510;color:#c8d0d8;font-family:'SF Mono','Menlo',monospace;display:flex;height:100vh;overflow:hidden}
#main{flex:1;position:relative}
canvas{display:block;position:absolute;top:0;left:0}
#hud{position:absolute;top:16px;left:16px;pointer-events:none;z-index:5}
#hud h1{font-size:15px;color:#fff;margin-bottom:2px}
#hud .sub{font-size:10px;color:#556}
#panel{width:320px;background:#08081a;border-left:1px solid #1a1a2a;padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;z-index:10}
.stat{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#0d0d24;border-radius:6px}
.stat .lbl{font-size:10px;color:#667}
.stat .val{font-size:14px;font-weight:bold}
.val.good{color:#44cc88}.val.warn{color:#ddcc44}.val.bad{color:#dd4444}
.btn{padding:10px 16px;border:1px solid #2a2a4a;border-radius:6px;background:#0d0d24;color:#aac;font-size:11px;cursor:pointer;text-align:center;transition:all .2s;font-family:inherit}
.btn:hover{background:#111133;border-color:#4488cc}
.btn.danger{background:#331111;border-color:#552222;color:#dd8888}
.btn.danger:hover{background:#441111;border-color:#882222}
.section-title{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:#556;margin:4px 0}
.info-box{padding:8px 10px;background:#0d0d18;border-radius:4px;font-size:10px;color:#778;line-height:1.7}
.info-box b{color:#aac}
#tooltip{position:fixed;pointer-events:none;z-index:20;background:rgba(8,8,24,0.95);border:1px solid #333;border-radius:6px;padding:8px 12px;font-size:10px;display:none;color:#aac}
</style>
</head>
<body>

<div id="main">
  <canvas id="metricCanvas"></canvas>
  <canvas id="meshCanvas" style="pointer-events:none"></canvas>
  <div id="hud">
    <h1>ENTANGLEMENT CRACK · 纠缠裂缝模型</h1>
    <div class="sub">每个三角形是一个量子比特 · 每条边是纠缠 · 割断纠缠 = 空间裂缝</div>
  </div>
</div>

<div id="panel">
  <div class="section-title">◆ 空间状态</div>
  <div class="stat"><span class="lbl">活跃纠缠边</span><span class="val good" id="activeEdges">0/0</span></div>
  <div class="stat"><span class="lbl">断裂边</span><span class="val" id="brokenEdges" style="color:#dd4444">0</span></div>
  <div class="stat"><span class="lbl">空间连通性</span><span class="val good" id="connectivity">连通</span></div>
  <div class="stat"><span class="lbl">最长测地距离</span><span class="val" id="maxDist" style="color:#88aadd">0</span></div>

  <div class="section-title">◆ 操作</div>
  <button class="btn" onclick="cutRandomEdge()">割断随机边</button>
  <button class="btn" onclick="cutEdgeLine()" id="lineBtn">画线割裂（拖拽）</button>
  <button class="btn danger" onclick="cutManyRandom(15)">切断 15 条随机边</button>
  <button class="btn danger" onclick="cutCenterRing()">切断中心环</button>
  <button class="btn" onclick="resetAll()">重置空间</button>

  <div class="section-title">◆ 解读</div>
  <div class="info-box">
    <b>蓝色</b> = 靠近中心（测地距离小）<br>
    <b>红色</b> = 远离中心（测地距离大）<br>
    <b>白色线</b> = 活跃纠缠边<br>
    <b>红色 ×</b> = 断裂边（空间裂缝）<br>
    <b>黄色闪烁</b> = 裂缝附近的应力集中<br>
    <br>
    割断一条边 → 该处"空间"撕裂<br>
    → 周围节点绕远路 → 测地距离跳变<br>
    → <b>这就是 ER=EPR：纠缠=空间本身</b>
  </div>
</div>
<div id="tooltip"></div>

<script>
// ===== Lattice Construction =====
const COLS = 28, ROWS = 24;
const nodes = [];
const edges = []; // {a,b,active,stress}

// Build triangular lattice
for (let r = 0; r < ROWS; r++) {
  for (let c = 0; c < COLS; c++) {
    nodes.push({
      id: r * COLS + c,
      row: r, col: c,
      // Position (hex offset)
      x: c + (r % 2) * 0.5,
      y: r * Math.sqrt(3) / 2,
      dist: Infinity, // geodesic distance from center
    });
  }
}

// Connect neighbors
function nodeId(r, c) {
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return -1;
  return r * COLS + c;
}

for (const n of nodes) {
  const r = n.row, c = n.col;
  const parity = r % 2;
  // 6 neighbors in triangular lattice
  const neighbors = [
    [r, c + 1], [r, c - 1],           // horizontal
    [r + 1, c + parity], [r + 1, c + parity - 1],  // down
    [r - 1, c + parity], [r - 1, c + parity - 1],  // up
  ];
  for (const [nr, nc] of neighbors) {
    const nid = nodeId(nr, nc);
    if (nid >= 0 && nid > n.id) {
      edges.push({ a: n.id, b: nid, active: true, stress: 0 });
    }
  }
}

// ===== Geodesic Computation =====
const centerId = nodeId(Math.floor(ROWS/2), Math.floor(COLS/2));

function buildAdjacency() {
  const adj = new Map();
  for (const n of nodes) adj.set(n.id, []);
  for (const e of edges) {
    if (e.active) {
      adj.get(e.a).push(e.b);
      adj.get(e.b).push(e.a);
    }
  }
  return adj;
}

function computeDistances() {
  const adj = buildAdjacency();
  const dist = new Map();
  const queue = [centerId];
  dist.set(centerId, 0);

  while (queue.length > 0) {
    const u = queue.shift();
    for (const v of (adj.get(u) || [])) {
      if (!dist.has(v)) {
        dist.set(v, dist.get(u) + 1);
        queue.push(v);
      }
    }
  }

  // Apply to nodes
  const maxD = Math.max(...Array.from(dist.values()));
  for (const n of nodes) {
    n.dist = dist.has(n.id) ? dist.get(n.id) : Infinity;
  }
  return { dist, maxD, reachable: dist.size, total: nodes.length };
}

let metricResult = computeDistances();

// ===== Rendering =====
const meshCanvas = document.getElementById('meshCanvas');
const mctx = meshCanvas.getContext('2d');
const metricCanvas = document.getElementById('metricCanvas');
const gctx = metricCanvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

let W, H, scale, offsetX, offsetY;

function resize() {
  W = meshCanvas.width = metricCanvas.width = document.getElementById('main').clientWidth;
  H = meshCanvas.height = metricCanvas.height = document.getElementById('main').clientHeight;

  // Fit lattice to canvas
  const margin = 60;
  const nodeW = COLS + 0.5;
  const nodeH = ROWS * Math.sqrt(3) / 2;
  scale = Math.min((W - 2 * margin) / nodeW, (H - 2 * margin) / nodeH);
  offsetX = (W - nodeW * scale) / 2;
  offsetY = (H - nodeH * scale) / 2;
}
resize();
window.addEventListener('resize', resize);

function toScreen(n) {
  return { sx: offsetX + n.x * scale, sy: offsetY + n.y * scale };
}

function drawMetricField() {
  gctx.clearRect(0, 0, W, H);

  const maxD = metricResult.maxD || 1;

  // Draw filled triangles for each triad
  for (const e of edges) {
    if (!e.active) continue;
    const na = nodes[e.a], nb = nodes[e.b];

    // Find common neighbors to form triangles
    const adj = buildAdjacency();
    const aNeighbors = new Set(adj.get(e.a) || []);
    const bNeighbors = new Set(adj.get(e.b) || []);

    for (const cn of aNeighbors) {
      if (bNeighbors.has(cn)) {
        const nc = nodes[cn];
        const pa = toScreen(na), pb = toScreen(nb), pc = toScreen(nc);

        // Color by average distance from center
        const avgDist = (na.dist + nb.dist + nc.dist) / 3;
        const t = avgDist === Infinity ? 1 : Math.min(avgDist / maxD, 1);

        // Color gradient: close=blue, far=red
        const r = Math.floor(t * 220 + 20);
        const g = Math.floor((1 - t) * 120 + 30);
        const b = Math.floor((1 - t) * 200 + 40);
        const alpha = 0.6 + (1 - t) * 0.3;

        gctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
        gctx.beginPath();
        gctx.moveTo(pa.sx, pa.sy);
        gctx.lineTo(pb.sx, pb.sy);
        gctx.lineTo(pc.sx, pc.sy);
        gctx.closePath();
        gctx.fill();
      }
    }
  }

  // Dark region for disconnected nodes
  for (const n of nodes) {
    if (n.dist === Infinity) {
      const p = toScreen(n);
      gctx.fillStyle = 'rgba(40,5,5,0.5)';
      gctx.beginPath();
      gctx.arc(p.sx, p.sy, scale * 0.3, 0, Math.PI * 2);
      gctx.fill();
    }
  }
}

function drawMesh(time) {
  mctx.clearRect(0, 0, W, H);

  // Draw edges
  for (const e of edges) {
    const na = nodes[e.a], nb = nodes[e.b];
    const pa = toScreen(na), pb = toScreen(nb);

    if (!e.active) {
      // Broken edge: red X mark
      const mx = (pa.sx + pb.sx) / 2, my = (pa.sy + pb.sy) / 2;
      const s = scale * 0.18;
      mctx.strokeStyle = 'rgba(255,60,60,0.7)';
      mctx.lineWidth = 1.5;
      mctx.beginPath();
      mctx.moveTo(mx - s, my - s);
      mctx.lineTo(mx + s, my + s);
      mctx.moveTo(mx + s, my - s);
      mctx.lineTo(mx - s, my + s);
      mctx.stroke();
    } else if (e.stress > 0.01) {
      // Stressed edge: yellow pulse
      const pulse = 0.5 + 0.5 * Math.sin(time * 0.01 + e.a + e.b);
      const alpha = 0.3 + e.stress * 0.7 * pulse;
      const width = 1 + e.stress * 3;
      mctx.strokeStyle = `rgba(255,220,80,${alpha})`;
      mctx.lineWidth = width;
      mctx.beginPath();
      mctx.moveTo(pa.sx, pa.sy);
      mctx.lineTo(pb.sx, pb.sy);
      mctx.stroke();
    } else {
      // Normal edge: thin white
      mctx.strokeStyle = 'rgba(180,200,220,0.25)';
      mctx.lineWidth = 0.6;
      mctx.beginPath();
      mctx.moveTo(pa.sx, pa.sy);
      mctx.lineTo(pb.sx, pb.sy);
      mctx.stroke();
    }
  }

  // Draw nodes
  for (const n of nodes) {
    const p = toScreen(n);
    const radius = n.id === centerId ? scale * 0.18 : scale * 0.07;

    if (n.id === centerId) {
      // Center: bright white glow
      mctx.fillStyle = '#ffffff';
      mctx.shadowColor = '#ffffff';
      mctx.shadowBlur = 10;
    } else if (n.dist === Infinity) {
      mctx.fillStyle = '#441111';
    } else {
      const t = Math.min(n.dist / (metricResult.maxD || 1), 1);
      const r = Math.floor(t * 200 + 40);
      const g = Math.floor((1 - t) * 100 + 30);
      const bl = Math.floor((1 - t) * 180 + 50);
      mctx.fillStyle = `rgb(${r},${g},${bl})`;
      mctx.shadowColor = 'transparent';
      mctx.shadowBlur = 0;
    }

    mctx.beginPath();
    mctx.arc(p.sx, p.sy, radius, 0, Math.PI * 2);
    mctx.fill();
  }
  mctx.shadowBlur = 0;
}

// ===== Edge Cutting =====
let cutCount = 0;
let isDrawingLine = false;

function cutEdge(index) {
  if (index < 0 || index >= edges.length) return;
  if (!edges[index].active) return;

  edges[index].active = false;
  cutCount++;

  // Propagate stress to neighboring edges
  const e = edges[index];
  const adj = buildAdjacency();
  const aNeighbors = adj.get(e.a) || [];
  const bNeighbors = adj.get(e.b) || [];

  // Find edges connected to a or b
  for (let i = 0; i < edges.length; i++) {
    if (!edges[i].active || i === index) continue;
    const connected = (edges[i].a === e.a || edges[i].b === e.a ||
                       edges[i].a === e.b || edges[i].b === e.b);
    if (connected) {
      edges[i].stress = Math.min(1, edges[i].stress + 0.35);
    }
  }

  // Recompute metric
  metricResult = computeDistances();
  updateStats();
}

function cutRandomEdge() {
  const actives = edges.filter(e => e.active);
  if (actives.length === 0) return;
  const pick = actives[Math.floor(Math.random() * actives.length)];
  cutEdge(edges.indexOf(pick));
}

function cutManyRandom(n) {
  for (let i = 0; i < n; i++) cutRandomEdge();
}

function cutCenterRing() {
  // Cut edges that form a ring around center
  const center = nodes[centerId];
  const targets = [];
  for (let i = 0; i < edges.length; i++) {
    if (!edges[i].active) continue;
    const na = nodes[edges[i].a], nb = nodes[edges[i].b];
    const da = Math.hypot(na.x - center.x, na.y - center.y);
    const db = Math.hypot(nb.x - center.x, nb.y - center.y);
    if (da > 2.2 && da < 3.0 && db > 2.2 && db < 3.0) {
      targets.push(i);
    }
  }
  // Cut intermittent edges to form a broken ring
  for (let i = 0; i < targets.length; i += 2) {
    cutEdge(targets[i]);
  }
}

function resetAll() {
  for (const e of edges) {
    e.active = true;
    e.stress = 0;
  }
  cutCount = 0;
  metricResult = computeDistances();
  updateStats();
}

function updateStats() {
  const active = edges.filter(e => e.active).length;
  document.getElementById('activeEdges').textContent = `${active}/${edges.length}`;
  document.getElementById('activeEdges').className = 'val ' +
    (active === edges.length ? 'good' : active > edges.length * 0.7 ? 'warn' : 'bad');

  document.getElementById('brokenEdges').textContent = cutCount;

  const connEl = document.getElementById('connectivity');
  if (metricResult.reachable === metricResult.total) {
    connEl.textContent = '连通';
    connEl.className = 'val good';
  } else {
    connEl.textContent = `${metricResult.reachable}/${metricResult.total} 孤立岛`;
    connEl.className = 'val bad';
  }

  document.getElementById('maxDist').textContent = metricResult.maxD || 0;
}

// ===== Mouse Interaction =====
let mouseDown = false;
let lastHoverEdge = -1;

function getEdgeAt(mx, my) {
  let best = -1, bestDist = 15;
  for (let i = 0; i < edges.length; i++) {
    if (!edges[i].active) continue;
    const pa = toScreen(nodes[edges[i].a]);
    const pb = toScreen(nodes[edges[i].b]);

    // Distance from point to line segment
    const dx = pb.sx - pa.sx, dy = pb.sy - pa.sy;
    const len2 = dx * dx + dy * dy;
    let t = ((mx - pa.sx) * dx + (my - pa.sy) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    const cx = pa.sx + t * dx, cy = pa.sy + t * dy;
    const dist = Math.hypot(mx - cx, my - cy);
    if (dist < bestDist) { bestDist = dist; best = i; }
  }
  return best;
}

metricCanvas.addEventListener('mousemove', (e) => {
  const rect = metricCanvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const edgeIdx = getEdgeAt(mx, my);

  if (edgeIdx >= 0 && edgeIdx !== lastHoverEdge) {
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 20) + 'px';
    tooltip.style.top = (e.clientY - 20) + 'px';
    tooltip.innerHTML = `边 #${edgeIdx}<br>节点 ${edges[edgeIdx].a} ↔ ${edges[edgeIdx].b}<br>应力: ${edges[edgeIdx].stress.toFixed(2)}<br><span style="color:#888">点击割断</span>`;
    metricCanvas.style.cursor = 'crosshair';
    lastHoverEdge = edgeIdx;
  } else if (edgeIdx < 0 && lastHoverEdge >= 0) {
    tooltip.style.display = 'none';
    metricCanvas.style.cursor = isDrawingLine ? 'crosshair' : 'default';
    lastHoverEdge = -1;
  }

  if (mouseDown && isDrawingLine && edgeIdx >= 0) {
    cutEdge(edgeIdx);
  }
});

metricCanvas.addEventListener('mousedown', (e) => {
  mouseDown = true;
  const rect = metricCanvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const edgeIdx = getEdgeAt(mx, my);
  if (edgeIdx >= 0) {
    cutEdge(edgeIdx);
  }
});

metricCanvas.addEventListener('mouseup', () => { mouseDown = false; });
metricCanvas.addEventListener('mouseleave', () => { mouseDown = false; tooltip.style.display = 'none'; });

document.getElementById('lineBtn').addEventListener('click', function() {
  isDrawingLine = !isDrawingLine;
  this.style.background = isDrawingLine ? '#331144' : '';
  this.style.borderColor = isDrawingLine ? '#8844cc' : '';
  metricCanvas.style.cursor = isDrawingLine ? 'crosshair' : 'default';
});

// ===== Stress Decay =====
function decayStress() {
  for (const e of edges) {
    e.stress *= 0.97;
    if (e.stress < 0.005) e.stress = 0;
  }
}

// ===== Animation Loop =====
function animate(time) {
  decayStress();
  drawMetricField();
  drawMesh(time);
  requestAnimationFrame(animate);
}

// ===== Keyboard =====
window.addEventListener('keydown', e => {
  if (e.key === 'c') cutRandomEdge();
  if (e.key === 'x') cutManyRandom(10);
  if (e.key === 'r') resetAll();
  if (e.key === 'o') cutCenterRing();
});

// ===== Init =====
updateStats();
requestAnimationFrame(animate);

// ===== Resize observer for canvas =====
window.addEventListener('resize', () => {
  resize();
  drawMetricField();
  drawMesh(0);
});
</script>
</body>
</html>
