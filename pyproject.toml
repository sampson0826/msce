[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "msce"
version = "0.1.0"
description = "Multi-Source Constraint Engine — detect hidden conflicts in scientific theories"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Deng Xinhang", email = "dxh@msce.ai"},
]
maintainers = [
    {name = "MSCE Collaboration"},
]
requires-python = ">=3.10"
keywords = ["constraint-checking", "scientific-computing", "cosmology", "physics", "multi-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.24",
    "requests>=2.28",
    "rich>=13.0",
]

[project.optional-dependencies]
notebook = ["jupyter", "matplotlib>=3.7", "seaborn>=0.12"]
dev = ["pytest>=7.0", "black", "ruff"]

[project.urls]
Homepage = "https://github.com/msce-ai/msce"
Documentation = "https://github.com/msce-ai/msce/wiki"
Repository = "https://github.com/msce-ai/msce"
Issues = "https://github.com/msce-ai/msce/issues"

[project.scripts]
msce = "msce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
