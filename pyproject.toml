[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stabilitybench"
version = "0.1.0"
description = "Measure LLM recursive stability via constraint residual beta"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Deng Xinhang", email = "dengxinhang@example.com"},
]
keywords = ["llm", "evaluation", "stability", "recursive-generation", "decay", "constraint-residual", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.20.0",
    "httpx>=0.25.0",
    "certifi>=2023.0.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.5",
]
dev = [
    "pytest>=7.0.0",
    "matplotlib>=3.5.0",
]

[project.scripts]
stabilitybench = "synthetic_decay_monitor.experiment_runner:main"

[project.urls]
Homepage = "https://github.com/constraint-residual/decay-monitor"
Repository = "https://github.com/constraint-residual/decay-monitor"

[tool.setuptools.packages.find]
include = ["synthetic_decay_monitor*"]
