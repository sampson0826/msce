# Aave v3 — FIXED: with timestamp_validator linear ramp
#
# Fix applied: linear ramp along oracle_freshness (y-axis).
# Same principle as LendVault V2: constant gradient in the axis
# orthogonal to where the main constraints' gradients align.
#
# borrow_gate and collateral_lock have gradients primarily in
# health_factor (x) direction (modulated by oracle sigmoid).
# The linear ramp provides ∇ = (0, scale) everywhere, ensuring
# ||Π|| never approaches zero.

protocol: aave_v3_fixed
description: >
  Fixed version. timestamp_validator linear ramp (∇=(0,8) everywhere)
  breaks the diffuse cancellation in the "gray area" dark zone.

state_space:
  - name: health_factor_norm
    range: [0, 1]
  - name: oracle_freshness
    range: [0, 1]

constraints:
  - name: borrow_gate
    layer: L1
    domain: tokenomics
    fn: product
    factors:
      - fn: gaussian
        center: [0.2, 0.5]
        width: [0.15, 0.4]
      - fn: sigmoid
        axis: y
        center: 0.3
        width: 0.08
    scale: 1.0

  - name: collateral_lock
    layer: L1
    domain: tokenomics
    fn: product
    factors:
      - fn: gaussian
        center: [0.25, 0.5]
        width: [0.18, 0.4]
      - fn: sigmoid
        axis: y
        center: 0.3
        width: 0.08
    scale: 1.0

  - name: liquidation_trigger
    layer: L1
    domain: risk
    fn: sigmoid
    axis: x
    center: 0.1
    width: 0.03
    scale: 2.0

  - name: oracle_validator
    layer: L2
    domain: oracle
    fn: gaussian
    center: [0.5, 0.85]
    width: [0.35, 0.18]
    scale: 0.6

  - name: price_corridor
    layer: L2
    domain: oracle
    fn: gaussian
    center: [0.5, 0.4]
    width: [0.4, 0.3]

  - name: debt_ceiling
    layer: L3
    domain: governance
    fn: gaussian
    center: [0.7, 0.5]
    width: [0.3, 0.4]
    scale: 0.5

  - name: timestamp_validator
    layer: L2
    domain: oracle
    fn: linear
    axis: y
    center: 0.5
    scale: 8.0
    description: >
      ★ THE FIX: Linear ramp along oracle_freshness.
      Constant ∇ = (0, 8.0) everywhere — breaks the diffuse
      cancellation in the gray area by providing non-aligned
      gradient. Same principle as LendVault V2 fix.

scan:
  cancellation_eps: 0.15
  individual_min: 0.25

dark_zone_type: protected
cancellation_signature: "c(p) > threshold — dark zone eliminated by timestamp_validator linear ramp"
