# Parity Wallet Freeze (2017) — Cold start gap
# Both constraints inactive at the initial state (x≈0, y≈0)
protocol: parity_wallet
description: >
  Parity multi-sig wallet library self-destruct. The library contract was deployed
  but never initialized (no one called initWallet on it directly). The initial
  state (uninitialized, no owner) has zero protection from BOTH the initialization
  guard and the ownership guard — a cold start gap.

state_space:
  - name: initialization_status
    range: [0, 1]
    description: 0 = uninitialized (initWallet never called), 1 = properly initialized
  - name: ownership_legitimacy
    range: [0, 1]
    description: 0 = no owner or attacker controls, 1 = legitimate owner established

constraints:
  - name: init_guard
    layer: L2
    domain: access_control
    fn: sigmoid
    axis: x
    center: 0.3
    width: 0.04
    description: >
      only_uninitialized modifier prevents re-initialization.
      Protection ≈ 0 when uninitialized (anyone can call initWallet).
      Protection ≈ 1 once initialized (re-init blocked).

  - name: owner_guard
    layer: L2
    domain: access_control
    fn: product
    factors:
      - fn: sigmoid
        axis: x
        center: 0.3
        width: 0.04
      - fn: sigmoid
        axis: y
        center: 0.3
        width: 0.04
    description: >
      only_owner modifier. Requires BOTH initialization AND legitimate owner.
      If either is missing, privileged operations (kill, transfer) are unprotected.

  - name: deploy_order
    layer: L1
    domain: lifecycle
    fn: sigmoid
    axis: x
    center: 0.1
    width: 0.03
    scale: 0.05
    certainty: 0.1
    description: >
      MISSING CONSTRAINT. Should ensure library contract is initialized at deploy time.
      Without this, the initial state is a cold start gap.

scan:
  residual_epsilon: 0.15
  cancellation_eps: 0.2
  individual_min: 0.2

dark_zone_type: cold_start_gap
cancellation_signature: "c(p) → 1, Σ||∇σ|| ≈ 0, ||Π|| ≈ 0"
