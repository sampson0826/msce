# LendVault v1 — Simple lending protocol (VULNERABLE design)
# Demonstrates constraint-first design: model first, find dark zones, fix, then generate code.
#
# This v1 spec has an intentional dark zone: the withdraw_check and balance_update
# constraints have opposing gradients at the withdrawal midpoint, creating a
# mutual_cancellation dark zone similar to The DAO.
#
# The fix (v2): add withdraw_sequencing constraint that breaks the cancellation.

protocol: lendvault_v1
description: >
  Simple ETH lending protocol. Users deposit ETH, can borrow against it.
  V1 has intentional dark zone: withdraw_check and balance_update cancel at
  (0.5, 0.5) — the withdrawal midpoint.

state_space:
  - name: health_factor_norm
    range: [0, 1]
    description: 0 = liquidatable (health < 1.0), 0.5 = marginal, 1 = well-collateralized
  - name: accounting_consistency
    range: [0, 1]
    description: 0 = totalAssets != totalLiabilities, 1 = fully consistent

constraints:
  - name: withdraw_check
    layer: L1
    domain: tokenomics
    fn: gaussian
    center: [0.7, 0.5]
    width: [0.25, 0.4]
    description: >
      Ensures user has sufficient collateral before allowing withdrawal.
      Strongest at high health factor — resists withdrawals that would
      reduce health below threshold.

  - name: balance_update
    layer: L1
    domain: accounting
    fn: gaussian
    center: [0.3, 0.5]
    width: [0.25, 0.4]
    description: >
      Updates balances after withdrawal. Centers at low health factor
      because balance updates are most critical when health is marginal.
      BUT: centered on OPPOSITE side of health axis from withdraw_check,
      creating opposing gradients at the midpoint.

  - name: accounting_sync
    layer: L1
    domain: accounting
    fn: gaussian
    center: [0.5, 0.5]
    width: [0.2, 0.2]
    scale: -0.8
    description: >
      Overall accounting consistency constraint. Negative at the midpoint
      where health transitions — represents the tension between allowing
      withdrawals and maintaining solvency. Zero gradient at center = inflection point.

scan:
  cancellation_eps: 0.15
  individual_min: 0.3

dark_zone_type: mutual_cancellation
cancellation_signature: "c(p) → 0, Σ||∇σ|| ≫ 0"
