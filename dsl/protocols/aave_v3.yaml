# Aave v3 — Oracle-modulated constraint topology
#
# Models the oracle staleness vulnerability (CVSS 9.8 in Spark/AaveOracle).
#
# Key modeling insight: borrow_gate computes health factor from oracle prices.
# When oracle is stale, borrow_gate's EFFECTIVE protection decays — it still
# has non-zero σ and ∇, but its decisions are based on wrong data.
#
# We model this by making borrow_gate a PRODUCT constraint:
#   effective_borrow_gate(x, y) = gaussian(x, low_HF) × sigmoid(y, stale_threshold)
#
# The sigmoid factor means borrow_gate is WEAK when oracle is stale (y < 0.3),
# regardless of health factor. This creates a genuine dark zone at the
# intersection of "HF is marginal" and "oracle is stale" — the exact
# region where real oracle staleness attacks happen.
#
# Fix: timestamp_validator — a sigmoid at oracle=0.35 that provides
# strong gradient opposing the borrow_gate decay.

protocol: aave_v3
description: >
  Oracle-modulated constraint topology. borrow_gate is modeled as a product
  of health_factor gaussian × oracle_freshness sigmoid. This captures the
  physical reality: when oracle data is stale, borrow protection is
  undermined even though the constraint is "active" in the gradient sense.

state_space:
  - name: health_factor_norm
    range: [0, 1]
  - name: oracle_freshness
    range: [0, 1]

constraints:
  # ── L1: Core lending constraints (modulated by oracle) ──

  - name: borrow_gate
    layer: L1
    domain: tokenomics
    fn: product
    factors:
      - fn: gaussian
        center: [0.2, 0.5]
        width: [0.15, 0.4]
      - fn: sigmoid
        axis: y
        center: 0.3
        width: 0.08
    scale: 1.0
    description: >
      ★ PRODUCT CONSTRAINT: borrow_gate(x,y) = gauss(x) × sigmoid(y).
      Gaussian in health_factor (strongest at low HF) × sigmoid in oracle_freshness
      (decays when oracle < 0.3). This is the core vulnerability topology:
      even at low HF, borrow protection is WEAK when oracle is stale because
      the sigmoid factor → 0.

  - name: collateral_lock
    layer: L1
    domain: tokenomics
    fn: product
    factors:
      - fn: gaussian
        center: [0.25, 0.5]
        width: [0.18, 0.4]
      - fn: sigmoid
        axis: y
        center: 0.3
        width: 0.08
    scale: 1.0
    description: >
      Collateral withdrawal protection, also oracle-modulated. Same sigmoid
      factor as borrow_gate — when oracle is stale, collateral lock weakens.

  # ── L1: Unmodulated constraints ──

  - name: liquidation_trigger
    layer: L1
    domain: risk
    fn: sigmoid
    axis: x
    center: 0.1
    width: 0.03
    scale: 2.0
    description: >
      Emergency liquidation boundary. NOT oracle-modulated — liquidation is
      based on current (possibly stale) prices. This is actually part of the
      problem: liquidation can trigger on stale prices too.

  # ── L2: Oracle layer ──

  - name: oracle_validator
    layer: L2
    domain: oracle
    fn: gaussian
    center: [0.5, 0.85]
    width: [0.35, 0.18]
    scale: 0.6
    description: >
      Validates oracle data. Strongest at HIGH freshness. Scale reduced (0.6)
      to reflect that it mainly checks price reasonability, not timestamps.
      ★ VULNERABILITY: Provides near-zero gradient at low oracle_freshness.

  - name: price_corridor
    layer: L2
    domain: oracle
    fn: gaussian
    center: [0.5, 0.4]
    width: [0.4, 0.3]
    description: >
      Price × HF safety corridor. Some coverage at moderate freshness.

  # ── L3: Governance ──

  - name: debt_ceiling
    layer: L3
    domain: governance
    fn: gaussian
    center: [0.7, 0.5]
    width: [0.3, 0.4]
    scale: 0.5
    description: >
      Governance-set debt ceiling. Slow to change, doesn't respond to
      oracle staleness automatically.

executors:
  - name: oracle_heartbeat
    layer: L2
    description: >
      ★ MISSING EXECUTOR: Should connect oracle_validator (L2) to borrow_gate
      (L1). When oracle freshness < heartbeat threshold, should suspend all
      L1 borrow/collateral operations. Without this executor, the sigmoid
      modulation in borrow_gate is the ONLY protection — and it decays
      gradually rather than blocking sharply.

scan:
  cancellation_eps: 0.15
  individual_min: 0.25

dark_zone_type: hostile_asymmetry
cancellation_signature: >
  c(p) → 0 where borrow_gate/collateral_lock sigmoid factors → 0 (stale oracle)
  AND health factor is low. All remaining constraints (liquidation_trigger,
  oracle_validator at high y, price_corridor) have gradients that don't
  oppose attacker pressure in this region.
  This is Type IV: hostile_asymmetry — protocol constraints are individually
  active but collectively weakened by oracle modulation.
