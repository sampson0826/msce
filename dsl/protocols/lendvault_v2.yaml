# LendVault v2 — FIXED design (dark zone truly eliminated)
#
# Fix applied: withdraw_sequencing with linear ramp along accounting_consistency.
# Key insight: withdraw_check and balance_update gradients are purely in the
# health_factor (x) direction. A linear ramp in accounting_consistency (y)
# provides constant ∇ = (0, scale) — breaking the x-cancellation at every point.
#
# Gaussian/sigmoid fixes fail because their position-varying gradients always
# leave a residual point where all components cancel. Only a linear function
# (constant ∇) guarantees no zero-crossing.

protocol: lendvault_v2
description: >
  Fixed version. withdraw_sequencing linear ramp breaks the mutual cancellation
  between withdraw_check and balance_update by providing constant y-axis gradient.

state_space:
  - name: health_factor_norm
    range: [0, 1]
  - name: accounting_consistency
    range: [0, 1]

constraints:
  - name: withdraw_check
    layer: L1
    domain: tokenomics
    fn: gaussian
    center: [0.7, 0.5]
    width: [0.25, 0.4]

  - name: balance_update
    layer: L1
    domain: accounting
    fn: gaussian
    center: [0.3, 0.5]
    width: [0.25, 0.4]

  - name: accounting_sync
    layer: L1
    domain: accounting
    fn: gaussian
    center: [0.5, 0.5]
    width: [0.2, 0.2]
    scale: -0.8

  - name: withdraw_sequencing
    layer: L1
    domain: security
    fn: linear
    axis: accounting_consistency
    center: 0.5
    scale: 5.0
    description: >
      ★ THE FIX: Linear ramp along accounting_consistency.
      withdraw_check ∇ ≈ (3.4, 0), balance_update ∇ ≈ (-3.4, 0)
      → cancel in x. Linear ramp ∇ = (0, 5.0) → ||Π|| ≥ 5.0 everywhere.
      Constant gradient = no residual dark zone.

scan:
  cancellation_eps: 0.15
  individual_min: 0.3

dark_zone_type: protected
cancellation_signature: "c(p) > threshold — dark zone eliminated by linear withdraw_sequencing"
